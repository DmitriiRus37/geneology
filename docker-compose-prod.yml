# Production compose for the remote machine. No build section here: the image is
# built locally (or in CI) and shipped to the server as a tarball, so the server
# never compiles anything and keeps no toolchain.
#
# There is no database: the tree is a folder of JSON cards (and photos/) in
# ./data next to this file, mounted into the container, so a restart, a reboot or
# a deploy keeps it. The first tree goes in as a zip through "Upload archive",
# which a folder accepts only while it is empty; "Download archive" (make backup)
# takes a copy off the server.
services:
  app:
    image: genealogy_app:3.0.0   # the tag `make build_docker` gives it (IMAGE in the Makefile)
    container_name: genealogy_app
    restart: always
    environment:
      # Basic auth. Compose refuses to start without them, so the tree can never
      # end up on the open internet unprotected by accident.
      GENEALOGY_USER: ${GENEALOGY_USER:?set GENEALOGY_USER in .env next to this file}
      GENEALOGY_PASS: ${GENEALOGY_PASS:?set GENEALOGY_PASS in .env next to this file}
      # The administrator: the only account that may open /admin. Optional — leave
      # it out and the page exists for nobody.
      GENEALOGY_ADMIN_USER: ${GENEALOGY_ADMIN_USER:-}
      GENEALOGY_ADMIN_PASS: ${GENEALOGY_ADMIN_PASS:-}
    ports:
      - "${GENEALOGY_PORT:-5179}:5179"
    # Request log, one line per request, rotated by the server itself at 10 MB
    # with three gzipped files kept. Bind-mounted so it survives a redeploy and
    # can be read straight from the host. It holds paths, statuses and client
    # addresses — never the tree, never the password.
    volumes:
      - ./logs:/app/logs
      # the tree itself: back it up with `make backup`, never delete it to "reset"
      - ./data:/app/data
    # Measured: ~19 MB idle, ~58 MB peak under load. 256 MB is roughly fourfold
    # headroom and still small enough to sit next to other services.
    deploy:
      resources:
        limits:
          memory: 256M
    # Cap the container's json logs so they cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
